name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Gallery reliability specs first for clearer CI signal on exact-replay regressions.
      - run: npm run test:e2e:gallery
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Play campaign loop is the flagship product bet — fail fast on regressions.
      - run: npm run test:e2e:play
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      # Auth / Heal / workflow-editor / dogfood metrics — fail fast before full suite.
      - run: npm run test:e2e:ops
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
      - run: npm run test:e2e
        env:
          CI: true
          PROMPT_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_PLAYWRIGHT: '1'
